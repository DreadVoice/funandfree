name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: ci-build-placeholder

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: run tests
        working-directory: backend
        run: ./mvnw -B -ntp verify

      - name: publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        working-directory: frontend
        run: npm ci

      - name: typecheck and build
        working-directory: frontend
        run: npm run build

  native-image:
    name: native image
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: build native image
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests -Pnative native:compile

      - name: smoke test the binary
        working-directory: backend
        env:
          APP_DB_PATH: /tmp/ci-smoke.db
        run: ./target/event-platform --spike

      - name: record binary size
        working-directory: backend
        run: ls -l target/event-platform | awk '{print $5 " bytes"}' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: event-platform
          path: backend/target/event-platform
          retention-days: 7

  publish-release:
    name: publish release
    needs: native-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: check release credentials
        id: credentials
        env:
          PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          if [ -n "$PROVIDER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Publish skipped: GCP_WIF_PROVIDER is not set. Run ops/setup-workload-identity.sh and add the repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/download-artifact@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          name: event-platform
          path: dist

      - name: checksum
        if: steps.credentials.outputs.ready == 'true'
        run: |
          chmod +x dist/event-platform
          sha256sum dist/event-platform | awk '{print $1}' > dist/event-platform.sha256

      - uses: google-github-actions/auth@v2
        if: steps.credentials.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.credentials.outputs.ready == 'true'

      - name: upload to the release bucket
        if: steps.credentials.outputs.ready == 'true'
        env:
          BUCKET: ${{ secrets.GCP_RELEASE_BUCKET }}
          SHA: ${{ github.sha }}
        run: |
          gcloud storage cp dist/event-platform "gs://${BUCKET}/releases/${SHA}/event-platform"
          gcloud storage cp dist/event-platform.sha256 "gs://${BUCKET}/releases/${SHA}/event-platform.sha256"
          echo "released gs://${BUCKET}/releases/${SHA}/" >> "$GITHUB_STEP_SUMMARY"
