spring:
  application:
    name: event-platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:${APP_DB_PATH:./data/events.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      pool-name: sqlite-pool
      maximum-pool-size: 3
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://securetoken.google.com/${FIREBASE_PROJECT_ID}
          audiences: ${FIREBASE_PROJECT_ID}
          jwk-set-uri: https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  jobs:
    # Service account allowed to call /internal/** via Cloud Scheduler OIDC
    scheduler-service-account: ${APP_SCHEDULER_SA:}
  reminders:
    lead-time: PT24H

logging:
  level:
    root: INFO
